  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
:root {
  --bg: #f6f4ee;
  --card: #ffffff;
  --ink: #15201c;
  --muted: #55625d;
  --primary: #0b5d4b;
  --primary-ink: #ffffff;
  --accent: #ffcf3f;
  --danger: #c0392b;
  --line: #d9d4c7;
  --ok: #1e8a4c;
  --warn: #b35c00;
  --radius: 22px;
  --tap: 64px;
  --fs: 22px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101614; --card: #1b2421; --ink: #f2f5f3; --muted: #a9b6b1;
    --primary: #3ccf9f; --primary-ink: #04140f; --line: #2f3b37;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: -apple-system, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "Noto Sans KR", sans-serif;
  font-size: var(--fs); line-height: 1.5; word-break: keep-all;
  display: flex; flex-direction: column; min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(env(safe-area-inset-top) + 10px) 16px 8px;
}
.brand { font-size: 24px; letter-spacing: -0.5px; }
.brand b { color: var(--primary); }
.top-actions { display: flex; gap: 8px; }
.chip {
  min-height: 48px; padding: 0 14px; border-radius: 999px;
  border: 2px solid var(--line); background: var(--card); font-size: 18px;
}
.chip[aria-pressed="false"] { opacity: .6; }

.stepbar {
  margin: 0 16px; padding: 10px 16px; border-radius: 14px;
  background: var(--primary); color: var(--primary-ink); font-weight: 700; font-size: 20px;
  display: flex; justify-content: space-between; gap: 8px; align-items: center;
}
.stepbar small { font-weight: 500; opacity: .9; font-size: 17px; }

.main .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.main { flex: 1; padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 14px; }

.card {
  background: var(--card); border-radius: var(--radius); padding: 20px;
  border: 2px solid var(--line);
}
.big { font-size: 30px; font-weight: 800; line-height: 1.35; margin: 0; }
.muted { color: var(--muted); font-size: 18px; margin: 0; }
.quote { font-size: 22px; background: var(--bg); padding: 14px 16px; border-radius: 14px; margin: 8px 0 0; }
.badge { display: inline-block; font-size: 15px; padding: 2px 10px; border-radius: 999px; background: #fff3cd; color: #7a5200; font-weight: 700; }

.slots { display: flex; flex-direction: column; gap: 10px; }
.slot {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 14px 16px; border-radius: 16px; border: 2px solid var(--line); background: var(--card);
  min-height: var(--tap);
}
.slot .k { font-size: 18px; color: var(--muted); }
.slot .v { font-size: 24px; font-weight: 800; }
.slot.missing { border-color: var(--accent); background: #fffaea; }
@media (prefers-color-scheme: dark) { .slot.missing { background: #2c2714; } }
.slot .edit { min-height: 48px; padding: 0 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); font-size: 18px; }

.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.choices .btn { min-height: var(--tap); }

/* 하단 고정 버튼 */
.dock {
  position: sticky; bottom: 0; padding: 10px 16px calc(env(safe-area-inset-bottom) + 12px);
  background: linear-gradient(to top, var(--bg) 80%, transparent);
  display: grid; gap: 10px;
}
.dock .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn {
  min-height: var(--tap); border-radius: 18px; border: 2px solid transparent;
  font-size: 22px; font-weight: 800; padding: 10px 16px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
}
.btn-xl { min-height: 76px; font-size: 25px; }
.btn-primary { background: var(--primary); color: var(--primary-ink); }
.btn-light { background: var(--card); border-color: var(--line); }
.btn-help { background: #ffe1dc; color: #8a1c10; border-color: #f2b5aa; }
.btn-talk { background: var(--accent); color: #2a2000; }
.btn-talk.listening { background: var(--danger); color: #fff; animation: pulse 1.2s infinite; }

  <!-- 직원에게 보여주는 도움 요청 카드 -->
  <div id="helpCard" class="overlay help" hidden role="dialog" aria-modal="true" aria-label="도움 요청">

      <p id="helpText" class="help-text"></p>

      <button id="helpClose" class="btn btn-xl btn-light">닫기</button>
    </div>
  </div>

  <!-- 119 응급 -->
  <div id="sos" class="overlay sos" hidden role="dialog" aria-modal="true" aria-label="119 응급 전화">
    <div class="help-inner">
      <p class="sos-title">🚨 많이 아프거나 다치셨나요?</p>

        <p id="sosScript" class="sos-script"></p>
        <p id="sosLoc" class="sos-loc">📍 위치 찾는 중…</p>

      <button id="sosGuardian" class="btn btn-xl btn-light" hidden>👪 보호자에게 알리기</button>
      <button id="sosNear" class="btn btn-xl btn-light">🚑 가까운 응급실 보기</button>
      <button id="sosClose" class="btn btn-light">닫기 (괜찮아요)</button>
    </div>
  </div>

  <!-- 설정 -->
  <div id="settings" class="overlay sheet" hidden role="dialog" aria-modal="true" aria-label="설정">
    <div class="sheet-inner">
      <h2>설정</h2>
      <label class="field">목소리
        <select id="voiceSelect"></select>
      </label>
      <label class="field">말하는 속도 <span id="rateVal"></span>
        <input id="rateInput" type="range" min="0.7" max="1.2" step="0.05">

        <button id="testVoice" class="btn btn-light">목소리 들어보기</button>
        <button id="permAgain" class="btn btn-light">위치·마이크 켜기</button>
        <button id="guardianBtn" class="btn btn-light">👪 보호자</button>
        <button id="resetAll" class="btn btn-light">처음부터 다시</button>
      </div>
      <button id="settingsClose" class="btn btn-xl btn-primary">닫기</button>
    </div>
  </div>

 *  화면 3: 병원 실내 한 걸음 안내 + 직원에게 보여주는 도움 요청 카드

 */
(() => {
  "use strict";
  const R = window.ROUTE;

  const store = {
    get(k, d) { try { const v = localStorage.getItem("hg:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("hg:" + k, JSON.stringify(v)); } catch {} },
    clear() { try { Object.keys(localStorage).filter(k => k.startsWith("hg:") && !["hg:permDone", "hg:guardians", "hg:gopts", "hg:busKey"].includes(k)).forEach(k => localStorage.removeItem(k)); } catch {} }
  };

  const state = {
    screen: store.get("screen", store.get("permDone", false) ? "home" : "perm"),   // talk | confirm | apply | outdoor | indoor | done
    slots: store.get("slots", { hospital: null, firstVisit: null, mobility: null, reception: null }),

    sound: store.get("sound", true),

        lat: d.lat, lng: d.lng, arriveRadius: 35, verified: true
      }],
      indoor: []

  const hsNum = (v) => { if (v === null || v === undefined || v === "") return null; const n = Number(v); return Number.isFinite(n) ? n : null; };
  // true only for the default-route 7-1 / 미금역3번출구(마을) step, and only when this app has no key and no server for bus info
  HS.arrivalFor = (b) => !!b && !busKey() && busBase() === null && Number(b.stationId) === HS.ARR.stationId && Number(b.routeId) === HS.ARR.routeId;
  // same logic as hospital-step js/arrival.js parseLocations(): bus positions on the loop, no minutes are promised
  HS.parseLoc = (reply) => {
    const { loopStops, boardSeq } = HS.ARR;
    const root = reply && typeof reply === "object" ? (reply.response || reply) : null; if (!root) return null;
    const body = root.msgBody && typeof root.msgBody === "object" ? root.msgBody : null;
    let list = body ? body.busLocationList : root.busLocationList;
    if (list && !Array.isArray(list)) list = [list];
    if (!Array.isArray(list)) return null;
    let best = null, atStop = false, near = false;
    for (const b of list) {
      if (!b || typeof b !== "object") continue;
      const seq = hsNum(b.stationSeq);
      if (seq === null || !Number.isInteger(seq) || seq < 1 || seq > loopStops) continue;
      if (seq === boardSeq) { if (hsNum(b.stateCd) === 1) atStop = true; else near = true; continue; }
      const away = (boardSeq - seq + loopStops) % loopStops;
      if (best === null || away < best) best = away;
    }
    if (atStop) return { stopsAway: 0 };
    if (near) return { stopsAway: 0, near: true };

  // resolves to items shaped like this app's busArrivals() result (buses[] has no minutes: min is null); throws on any failure
  HS.arrivals = async () => {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 6000);
    try {
      const r = await fetch(HS.ARRIVAL_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ stationId: HS.ARR.stationId, routeId: HS.ARR.routeId }), signal: ctl.signal });

    } finally { clearTimeout(t); }
  };

    if (!b) return `지금은 ${name}번 버스 위치 정보가 없어요. ${HS.HOURS}`;

    if (b.stops === 1) return `${name}번 버스가 바로 전 정류장에 있어요.`;
    return `${name}번 버스가 ${b.stops}정거장 전에 있어요.`;
  };
  HS.lineHtml = (b) => `<b>${HS.locText(b, HS.ARR.routeName).replace(/\.$/, "")}</b>`;
  HS.noBusHtml = (name) => `<p class="bus-row">지금은 ${esc(name)}번 버스 위치 정보가 없어요.<br><small>${HS.HOURS}</small></p>`;

  // AI visit parsing through the Make webhook. Contract: hospital-step js/intent.js validateAiReply().
  HS.asNull = (v) => (v === null || (typeof v === "string" && /^\s*(null)?\s*$/i.test(v)) ? null : v);
  HS.parse = async (text) => {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 8000);
    try {
      const r = await fetch(HS.WEBHOOK_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }), signal: ctl.signal });
      if (r.status !== 200) return null;
      const raw = await r.text(); if (raw.length > 4096) return null;
      const j = JSON.parse(raw);
      if (!j || typeof j !== "object" || Array.isArray(j)) return null;
      for (const k of ["hospital", "visit", "mobility", "reception"]) if (!Object.prototype.hasOwnProperty.call(j, k)) return null;
      const o = {};
      const h = HS.asNull(j.hospital);
      if (h !== null) { const n = String(h).replace(/\s+/g, "").toLowerCase(); if (n === "snubh" || n === "분당서울대병원" || n === "분당서울대학교병원") o.hospital = "분당서울대학교병원"; else return null; }
      const v = HS.asNull(j.visit); if (v !== null) { if (v === "first") o.firstVisit = true; else if (v === "return") o.firstVisit = false; else return null; }
      const m = HS.asNull(j.mobility); if (m !== null) { const mm = { walker: "보행기", wheelchair: "휠체어", none: "도움 필요 없음" }[m]; if (!mm) return null; o.mobility = mm; }
      const c = HS.asNull(j.reception); if (c !== null) { if (c === "need") o.reception = true; else if (c === "no") o.reception = false; else return null; }

      return o;

  HS.norm = (s) => String(s || "").replace(/[\s.,!?;~…'"“”‘’·\-]/g, "");

  const synth = window.speechSynthesis;

  // 문장을 끊어 읽어 숨 쉬는 듯한 간격을 주고, 긴 문장이 중간에 끊기는 브라우저 문제를 피합니다.
  function splitSentences(t) {

  }

          const a = new Audio(hsUrl); a.playbackRate = Math.min(1.2, Math.max(0.8, state.rate || 1));
          a.onended = () => { if (token === speakToken) spokeDone(); };
          a.onerror = () => { if (token === speakToken && audioEl === a) spokeDone(); };
          audioEl = a;
          await a.play();
          return;
        } catch { if (audioEl && token === speakToken) audioEl = null; }
        if (token !== speakToken) return;
      }
    }
    /* end [ported from hospital-step] */
    const useServer = lang === "ko-KR" && server.tts && ($("#voiceSelect").value === "server");
    if (useServer) {
      try {
        const r = await fetch("api/tts", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text, speed: state.rate }) });
        if (!r.ok) throw new Error("tts");
        const blob = await r.blob();
        if (token !== speakToken) return;
        audioEl = new Audio(URL.createObjectURL(blob));
        audioEl.onended = () => { if (token === speakToken) spokeDone(); };
        await audioEl.play();
        return;
      } catch { /* 기기 목소리로 넘어감 */ }
    }
    if (!synth) return spokeDone();
    const v = lang === "ko-KR"
      ? (voices.find(x => x.voiceURI === $("#voiceSelect").value) || voices[0])
      : synth.getVoices().filter(x => x.lang.replace("_", "-").toLowerCase().startsWith(lang.slice(0, 2).toLowerCase())).sort((x, y) => scoreAny(y) - scoreAny(x))[0];
    const parts = splitSentences(text);
    parts.forEach((s, i) => {
      const u = new SpeechSynthesisUtterance(s);
      u.lang = lang; if (v) u.voice = v;
      u.rate = state.rate; u.pitch = 1.0; u.volume = 1;
      if (i === parts.length - 1) u.onend = () => { if (token === speakToken) spokeDone(); };
      synth.speak(u);
    });
  }
  function scoreAny(v) { let s = 0; NATURAL_HINTS.forEach((re, i) => { if (re.test(v.name)) s += 20 - i; }); return s; }
  function vibrate(p) { try { navigator.vibrate && navigator.vibrate(p); } catch {} }

  // ───────────────────────── 음성 인식 ─────────────────────────
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  // 말하기: 브라우저 음성 인식 → 안 되면 휴대폰 키보드의 🎤(받아쓰기)로 대신 입력
  let activeRec = null;
  // 말하기 시작 알림음 ("띵") — 언제 말하면 되는지 소리로 알려 줌
  let beepCtx = null;
  function beep(freq = 880, ms = 140) {
    try {
      beepCtx = beepCtx || new (window.AudioContext || window.webkitAudioContext)();
      const o = beepCtx.createOscillator(), g = beepCtx.createGain();
      o.frequency.value = freq; o.connect(g); g.connect(beepCtx.destination);
      const t = beepCtx.currentTime; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);
      o.start(t); o.stop(t + ms / 1000 + 0.02);
    } catch {}
  }
  // 큰 "말씀하세요" 화면
  function listenSheet(prompt) {
    let el = $("#listenSheet");
    if (!el) {
      el = document.createElement("div"); el.id = "listenSheet"; el.className = "overlay listen-sheet"; el.setAttribute("role", "dialog"); el.setAttribute("aria-modal", "true"); el.setAttribute("aria-live", "polite");
      el.innerHTML = `<div class="ls-inner">
        <p class="ls-prompt" id="lsPrompt"></p>
        <div class="ls-mic" id="lsMic" aria-hidden="true">🎙</div>
        <p class="ls-state" id="lsState">말씀하세요</p>
        <p class="ls-text" id="lsText"></p>
        <div class="ls-btns" id="lsBtns"></div>
      </div>`;
      document.body.append(el);
    }
    el.hidden = false;
    $("#lsPrompt").textContent = prompt || "";
    return el;
  }
  function closeListenSheet() { const el = $("#listenSheet"); if (el) el.hidden = true; }

  // 말 듣기
  //  · 누르면 바로 큰 화면 + 띵 소리 → 말하면 글자가 바로 보임
  //  · 말하다가 잠깐 쉬어도(약 3초까지) 끊지 않고 이어서 들음
  //  · 다 말하면 "다 말했어요", 아무 말도 없으면 "다시 말하기" 버튼
  function listen(onText, trigger, opts = {}) {
    if (activeRec) { activeRec.finish(); return; }          // 듣는 중에 한 번 더 누르면 끝
    if (!SR || !isSecureContext || inApp) {
      const adv = browserAdvice();
      return typeFallback(onText, adv ? adv.msg : "이 브라우저는 바로 듣기를 지원하지 않아요.", { openBrowser: !!(adv && adv.btn), openLabel: adv && adv.btn });
    }
    stopSpeaking();
    const big = !opts.quiet;                                   // 자동 듣기·마이크 시험은 큰 화면 없이
    const label = trigger ? (trigger.dataset.label || (trigger.dataset.label = trigger.innerHTML)) : "";
    const PAUSE_OK = 3200, FIRST_WAIT = 10000, MAX = 30000;   // 어르신 말 속도에 맞춘 넉넉한 시간
    const S = { parts: [], cur: "", startedAt: Date.now(), lastSpeech: 0, done: false, cancelled: false, errored: "", rec: null, restarts: 0, timer: null };
    const fullText = () => (S.parts.join(" ") + " " + S.cur).replace(/\s+/g, " ").trim();
    const paint = () => {
      const t = fullText();
      const q = $("#heardLive"); if (q && t) { q.hidden = false; q.textContent = "“" + t + "”"; }
      if (big) { $("#lsText").textContent = t ? "“" + t + "”" : ""; $("#lsState").textContent = t ? "듣고 있어요… 다 말하면 기다리세요" : "말씀하세요"; }
    };
    const setBtns = (mode) => {
      if (!big) return;
      const b = $("#lsBtns"); b.innerHTML = "";
      if (mode === "listening") {
        b.append(btn("✅ 다 말했어요", "btn-xl btn-primary", () => api.finish()), btn("✖ 그만", "btn-light", () => api.cancel()));
      } else if (mode === "nothing") {
        b.append(btn("🎙 다시 말하기", "btn-xl btn-talk", () => { closeListenSheet(); listen(onText, btn_, opts); }),
          btn("⌨️ 글자로 쓰기", "btn-light", () => { closeListenSheet(); typeFallback(onText); }), btn("✖ 닫기", "btn-light", () => closeListenSheet()));
      }
    };
    const btn_ = trigger;
    const uiOn = () => {
      if (trigger) { trigger.classList.add("listening"); trigger.innerHTML = "🎙 듣고 있어요…"; }
      if (big) { listenSheet(opts.prompt); $("#lsMic").classList.add("on"); paint(); setBtns("listening"); }
    };
    const uiOff = () => {
      if (trigger) { trigger.classList.remove("listening"); trigger.innerHTML = label; }
      if (big) $("#lsMic").classList.remove("on");
    };
    const end = () => {
      clearInterval(S.timer); activeRec = null; uiOff();
      const t = fullText();
      if (S.cancelled) { closeListenSheet(); return; }
      if (t) {
        listen.miss = 0;
        if (big) { $("#lsState").textContent = "✅ 이렇게 들었어요"; $("#lsBtns").innerHTML = ""; beep(660, 120); setTimeout(closeListenSheet, 900); }
        return onText(t);
      }
      const er = S.errored;
      if (er === "not-allowed" || er === "service-not-allowed") {
        closeListenSheet();
        if (opts.quiet) {
          if (opts.onDenied) return opts.onDenied(er);
          if (typeof setHandsfree === "function" && HF.on) { HF.on = false; store.set("handsfree", false); fab.classList.remove("hf"); }
          return speak(isIOS ? "아이폰에서는 말할 때마다 오른쪽 아래 마이크 버튼을 눌러 주세요." : "마이크가 막혀 있어요. 메뉴의 마이크 시험에서 고칠 수 있어요.");
        }
        perm.mic = "denied";
        const why = isIOS ? "마이크나 받아쓰기가 꺼져 있어요." : "마이크가 막혀 있어요.";
        speak(why + " 마이크 고치는 방법을 볼 수 있어요.");
        return typeFallback(onText, why, { fixMic: true });
      }
      if (er === "audio-capture") { closeListenSheet(); speak("다른 앱이 마이크를 쓰고 있어요."); return typeFallback(onText, "다른 앱이 마이크를 쓰고 있어요. 통화나 녹음을 끄고 다시 해 보세요."); }
      if (er === "network" || er === "language-not-supported") { closeListenSheet(); return typeFallback(onText, "인터넷이 약해서 바로 듣기가 안 돼요."); }
      if (opts.quiet) { if (opts.onIdle) opts.onIdle(); return; }
      // 아무 말도 못 들음 → 큰 화면에서 바로 다시
      listen.miss = (listen.miss || 0) + 1;
      $("#lsState").textContent = "잘 안 들렸어요";
      $("#lsText").textContent = listen.miss >= 2 ? "휴대폰을 입 가까이 대고, 조금 크게 말씀해 보세요. 글자로 써도 돼요." : "‘다시 말하기’를 누르고 말씀해 주세요.";
      setBtns("nothing");
      speak("잘 안 들렸어요. 다시 말하기를 누르고, 휴대폰에 입을 가까이 대고 말씀해 주세요.", { force: true });
    };
    const startOne = () => {
      let rec;
      try { rec = new SR(); } catch { S.errored = "error"; return end(); }
      rec.lang = "ko-KR"; rec.interimResults = true; rec.maxAlternatives = 1; rec.continuous = false;
      rec.onresult = (e) => {
        let t = ""; for (const r of e.results) t += r[0].transcript;
        S.cur = t; S.lastSpeech = Date.now(); paint();
      };
      rec.onerror = (e) => { if (e.error !== "no-speech" && e.error !== "aborted") S.errored = e.error || "error"; };
      rec.onend = () => {
        if (S.cur.trim()) S.parts.push(S.cur.trim()); S.cur = "";
        if (S.done || S.cancelled || S.errored) return end();
        const now = Date.now(), heard = S.parts.length > 0;
        // 말하다 잠깐 쉰 거면, 혹은 아직 첫 말을 기다리는 중이면 이어서 듣기
        const keep = heard ? now - S.lastSpeech < PAUSE_OK : now - S.startedAt < FIRST_WAIT;
        if (keep && now - S.startedAt < MAX && S.restarts < 12) {
          S.restarts++;
          try { startOne(); return; } catch { /* 다시 켜기가 막힌 휴대폰은 여기서 끝 */ }
        }
        end();
      };
      S.rec = rec;
      rec.start();
    };
    const api = {
      finish() { S.done = true; try { S.rec && S.rec.stop(); } catch { end(); } },
      cancel() { S.cancelled = true; try { S.rec && S.rec.abort(); } catch { end(); } },
      stop() { api.finish(); }, abort() { api.cancel(); }
    };
    activeRec = api;
    uiOn();
    try { startOne(); } catch { activeRec = null; uiOff(); closeListenSheet(); return typeFallback(onText); }
    beep(); vibrate(40);
    // 지켜보기: 말이 끝나고 조용하면 마무리, 너무 오래 아무 말 없으면 마무리
    S.timer = setInterval(() => {
      const now = Date.now(), heard = S.parts.length > 0 || S.cur.trim();
      if ((heard && S.lastSpeech && now - S.lastSpeech > PAUSE_OK) || (!heard && now - S.startedAt > FIRST_WAIT) || now - S.startedAt > MAX) {
        clearInterval(S.timer); S.done = true; try { S.rec && S.rec.stop(); } catch { end(); }
      }
    }, 300);
  }

  // 대체 입력: 휴대폰 키보드의 🎤 버튼(받아쓰기)은 거의 모든 휴대폰에서 됩니다
  function typeFallback(onText, reason = "", fx = {}) {
    const old = $("#typeSheet"); if (old) old.remove();
    const wrap = document.createElement("div");
    wrap.id = "typeSheet"; wrap.className = "overlay sheet"; wrap.setAttribute("role", "dialog");
    wrap.innerHTML = `<div class="sheet-inner">
        ${reason ? `<p class="muted">${esc(reason)}</p>` : ""}
        <p class="big" style="font-size:26px">아래 칸을 누르고,<br>키보드의 <span class="kbd">🎤</span> 버튼을 눌러 말씀하세요.</p>
        <p class="muted">${isIOS ? "키보드 오른쪽 아래(또는 스페이스 옆)에 있는 마이크 모양이에요." : "키보드 위쪽 줄이나 오른쪽 위에 있는 마이크 모양이에요."} 글자로 써도 돼요.</p>
        <textarea id="typeBox" rows="3" placeholder="예) 분당서울대병원 처음 가요"></textarea>
        <button class="btn btn-xl btn-primary" id="typeOk">✅ 다 말했어요</button>
        ${fx.fixMic ? '<button class="btn btn-light" id="typeFix">🎙 마이크 고치기 (시험해 보기)</button>' : ""}
        ${fx.openBrowser ? `<button class="btn btn-light" id="typeOpen">${esc(fx.openLabel || "🌐 다른 브라우저로 열기")}</button>` : ""}
        <button class="btn btn-light" id="typeCancel">닫기</button>
      </div>`;
    document.body.append(wrap);
    const box = wrap.querySelector("#typeBox");
    setTimeout(() => box.focus(), 50);
    wrap.querySelector("#typeOk").onclick = () => { const t = box.value.trim(); wrap.remove(); if (t) onText(t); };
    wrap.querySelector("#typeCancel").onclick = () => wrap.remove();
    const tf = wrap.querySelector("#typeFix"); if (tf) tf.onclick = () => { wrap.remove(); openScreen("mictest"); };
    const to = wrap.querySelector("#typeOpen"); if (to) to.onclick = () => openInGoodBrowser();
    speak("아래 칸을 누르고, 키보드의 마이크 버튼을 눌러 말씀해 주세요.");
  }

  // ───────────────────────── AI 방문 조건 해석 ─────────────────────────
  // 네 가지 항목만 뽑음: 병원, 첫 방문 여부, 이동 도움, 접수 도움
  function localParse(text) {
    const t = text.replace(/\s+/g, "");
    const out = {};
    if (/분당서울대|서울대병원|서울대학교병원|분당서울|서울대/.test(t)) out.hospital = "분당서울대학교병원";
    else { const m = text.match(/([가-힣A-Za-z]{2,}(?:대학교)?병원)/); if (m) out.hospital = m[1]; }

    if (/처음|첫방문|첫진료|초진|첨가|첨이|한번도안/.test(t)) out.firstVisit = true;
    else if (/다녀|가봤|가본|재진|두번째|또가|다니는|다니던|진료받던/.test(t)) out.firstVisit = false;

    if (/휠체어/.test(t)) out.mobility = "휠체어";
    else if (/보행기|워커|유모차/.test(t)) out.mobility = "보행기";
    else if (/지팡이/.test(t)) out.mobility = "지팡이";
    else if (/혼자잘걸|걷는건괜찮|잘걸어/.test(t)) out.mobility = "도움 필요 없음";
    else if (/걷기힘|다리가|무릎|거동/.test(t)) out.mobility = "걷기 힘듦";

    if (/접수|수납|창구|서류/.test(t) && !/접수는혼자|접수는제가|접수는괜찮/.test(t)) out.reception = true;
    else if (/접수는혼자|접수는제가|접수는괜찮|혼자할수/.test(t)) out.reception = false;
    else if (/도와줄사람|같이가줄|동행|데려다/.test(t) && out.reception == null) out.reception = true;
    return out;
  }
  async function aiParse(text) {
    if (server.ai) {
      try {
        const r = await fetch("api/parse", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
        if (r.ok) { const j = await r.json(); return { ...localParse(text), ...clean(j) }; }
      } catch {}
    }
    /* [ported from hospital-step] no server AI: try the Make webhook (8 s timeout); null result falls back to localParse */
    if (!server.ai) {
      await healthDone;
      const hs = await HS.parse(text);
      if (hs) return { ...localParse(text), ...hs };
    }
    /* end [ported from hospital-step] */
    return localParse(text);
  }
  function clean(j) {
    const o = {};
    if (typeof j.hospital === "string" && j.hospital) o.hospital = j.hospital;
    if (typeof j.firstVisit === "boolean") o.firstVisit = j.firstVisit;
    if (typeof j.mobility === "string" && j.mobility) o.mobility = j.mobility;
    if (typeof j.reception === "boolean") o.reception = j.reception;
    return o;
  }

  const SLOT_DEF = [
    { key: "hospital", label: "병원", ask: "어느 병원에 가세요?", options: [["분당서울대학교병원", "분당서울대병원"]] , fmt: v => v },
    { key: "firstVisit", label: "방문", ask: "이 병원에 처음 가시는 건가요?", options: [[true, "처음 가요"], [false, "가 봤어요"]], fmt: v => v ? "처음 방문 (초진)" : "다시 방문 (재진)" },
    { key: "mobility", label: "이동", ask: "걸을 때 무엇을 쓰세요?", options: [["보행기", "보행기"], ["휠체어", "휠체어"], ["지팡이", "지팡이"], ["도움 필요 없음", "혼자 잘 걸어요"]], fmt: v => v === "도움 필요 없음" ? "이동 도움 필요 없음" : v + " 이동 도움" },
    { key: "reception", label: "원내", ask: "병원 안에서 접수도 도와 드릴까요?", options: [[true, "네, 도와주세요"], [false, "혼자 할게요"]], fmt: v => v ? "접수 도움 필요" : "접수는 혼자" }
  ];
  const missingSlots = () => SLOT_DEF.filter(d => state.slots[d.key] == null);

  // ───────────────────────── 화면 공통 ─────────────────────────
  function setStep(title, sub) { stepbar.innerHTML = `<span>${title}</span>${sub ? `<small>${sub}</small>` : ""}`; }
  function btn(label, cls, onClick, extra = {}) {
    const b = document.createElement("button");

  function row(...els) { const d = document.createElement("div"); d.className = "row2"; d.append(...els); return d; }
  function go(screen) { if (typeof micTestStop === "function") micTestStop(); if (screen !== "doctor" && typeof docStopRec === "function") docStopRec(); state.screen = screen; save(); stopNav(); render(); window.scrollTo(0, 0); }
  const replayBtn = () => btn("🔁 다시 듣기", "btn-light", () => speak(state.lastSaid, { force: true }));
  const helpBtn = () => btn("🙋 도움 요청", "btn-help", openHelp);

  function openHelp() {
    const s = state.slots;
    let where = "";
    if (state.screen === "outdoor") where = `지금 “${RT().outdoor[state.outIdx].place}”(으)로 가는 중입니다.`;
    else if (state.screen === "indoor") where = "1동 1층 ‘처음오신 창구’를 찾고 있습니다.";
    const lines = [
      `${(!isPreset() && state.dest.name) || s.hospital || "분당서울대학교병원"}${s.firstVisit === false ? "에 진료 받으러 왔습니다." : " 첫 방문입니다."}`,
      s.mobility && s.mobility !== "도움 필요 없음" ? `${s.mobility}를 사용 중입니다.` : "",
      where,
      !isPreset() && state.screen === "outdoor" ? "이곳에 가는 길을 알려 주세요." :
      state.screen === "indoor" || state.screen === "outdoor" ? "1동 1층 처음오신 창구 가는 길을 알려 주세요." : "도와주세요.",
    ].filter(Boolean);
    $("#helpText").innerHTML = lines.join("<br>");
    $("#helpCard").hidden = false;
    const hg = $("#helpGuardian"); if (hg) hg.hidden = !G.list().length;
    vibrate(80);
    speak("직원분께 이 화면을 보여 주세요.");
  }
  $("#helpClose").onclick = () => { $("#helpCard").hidden = true; };

  // ───────────────────────── 화면 1: 말하기 ─────────────────────────
  // "병원 가는 길 시작": 화면을 열면서 바로 듣기 (한 번만 누르면 됨)
  const TALK_PROMPT = "어느 병원에 가세요?\n예) “분당서울대병원 처음 가요. 보행기 써요”";
  function startTalk() {
    go("talk");
    const tb = dock.querySelector(".btn-talk");
    listen(handleUtterance, tb, { prompt: TALK_PROMPT });
  }
  // 처음 화면에서 아무 말이나: 명령 → 병원 가기 → 병원 찾기 순서로 알아듣기
  function homeVoice(t) {
    const tt = t.replace(/\s+/g, " ");

  // ───────────────────────── 화면 2: 야외 GPS 길안내 ─────────────────────────
  const nav = { watchId: null, pos: null, acc: null, heading: null, headingAt: 0, lastDirWord: "", lastDirSpokeAt: 0, arrived: false, nearSaid: false, demoTimer: null, orientHandler: null, sensorAsked: false };

  const toRad = d => d * Math.PI / 180, toDeg = r => r * 180 / Math.PI;
  function distanceM(a, b) {
    const R0 = 6371000, dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2;
    return 2 * R0 * Math.asin(Math.sqrt(h));
  }
  function bearing(a, b) {
    const y = Math.sin(toRad(b.lng - a.lng)) * Math.cos(toRad(b.lat));
    const x = Math.cos(toRad(a.lat)) * Math.sin(toRad(b.lat)) - Math.sin(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.cos(toRad(b.lng - a.lng));
    return (toDeg(Math.atan2(y, x)) + 360) % 360;
  }
  const norm180 = d => ((d + 540) % 360) - 180;
  function dirWord(rel) {
    const a = Math.abs(rel);
    if (a < 25) return "앞으로 곧장";
    if (a < 70) return rel > 0 ? "오른쪽 앞으로" : "왼쪽 앞으로";
    if (a < 120) return rel > 0 ? "오른쪽으로" : "왼쪽으로";
    return "뒤로 돌아서";
  }
  function distText(m) {
    if (m < 10) return "바로 앞";
    if (m < 1000) return Math.round(m / 5) * 5 + "m";
    return (m / 1000).toFixed(1) + "km";
  }
  function distSpeech(m) {
    if (m < 10) return "바로 앞이에요";
    const steps = Math.max(5, Math.round(m / 0.6 / 5) * 5); // 어르신 보폭 약 60cm
    return `${Math.round(m / 5) * 5}미터, 약 ${steps}걸음 남았어요`;
  }

  async function askSensorPermission() {
    // iOS 13+ 는 사용자가 버튼을 눌러야 방향 센서를 허용할 수 있음
    try {
      if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
        const r = await DeviceOrientationEvent.requestPermission();
        return r === "granted";
      }
    } catch {}
    return true;
  }
  function startCompass() {
    if (nav.orientHandler) return;
    const handler = (e) => {
      let h = null;
      if (typeof e.webkitCompassHeading === "number") h = e.webkitCompassHeading;              // iOS
      else if (e.absolute && typeof e.alpha === "number") h = (360 - e.alpha) % 360;             // Android(절대 방위)
      if (h == null || isNaN(h)) return;
      // 화면 회전 보정
      const so = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
      h = (h + so + 360) % 360;
      // 흔들림 줄이기 (원형 저역통과)
      if (nav.heading == null) nav.heading = h;
      else nav.heading = (nav.heading + norm180(h - nav.heading) * 0.25 + 360) % 360;
      nav.headingAt = Date.now();
      nav.compassLive = true;
      if (!nav.raf) nav.raf = requestAnimationFrame(() => { nav.raf = 0; paintArrow(); });
      if (Date.now() - (nav.fullAt || 0) > 1000) { nav.fullAt = Date.now(); updateNavUI(); }
    };
    nav.orientHandler = handler;
    if ("ondeviceorientationabsolute" in window) window.addEventListener("deviceorientationabsolute", handler);
    window.addEventListener("deviceorientation", handler);
  }
  function stopCompass() {
    if (!nav.orientHandler) return;
    window.removeEventListener("deviceorientationabsolute", nav.orientHandler);
    window.removeEventListener("deviceorientation", nav.orientHandler);
    nav.orientHandler = null;
  }
  function startGPS() {
    if (state.demo) return startDemo();
    if (!("geolocation" in navigator)) { setGpsStatus("이 기기는 위치(GPS)를 쓸 수 없어요. 표지판 안내를 따라가세요.", true); return; }
    if (!isSecureContext) setGpsStatus("위치를 쓰려면 https 주소로 열어야 해요.", true);
    nav.watchId = navigator.geolocation.watchPosition(
      (p) => { nav.pos = { lat: p.coords.latitude, lng: p.coords.longitude }; nav.acc = p.coords.accuracy;
               if (nav.heading == null && p.coords.heading != null && !isNaN(p.coords.heading) && p.coords.speed > 0.5) nav.heading = p.coords.heading;
               updateNavUI(); },
      (err) => {
        const msg = err.code === 1 ? "위치 권한이 꺼져 있어요. 표지판 안내와 ‘도착했어요’ 버튼으로 가실 수 있어요." : "위치를 찾는 중이에요. 하늘이 보이는 곳에서 잠시 기다려 주세요.";
        setGpsStatus(msg, true);
        if (err.code === 1 && !$("#fixPerm")) { const f = btn("📍 위치 권한 켜는 방법 보기", "btn-light", () => go("perm")); f.id = "fixPerm"; $("#gpsStatus").after(f); }
        if (err.code === 1 && !nav.permSaid) { nav.permSaid = true; speak("위치 권한이 꺼져 있어요. 표지판을 보고 가시다가, 도착하면 도착했어요 버튼을 눌러 주세요."); }
      },
      { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 }
    );
  }
  // 시연 모드: 실제 GPS 대신 목적지 쪽으로 조금씩 걸어가는 것처럼 위치를 움직임
  function startDemo() {
    const step = RT().outdoor[state.outIdx];
    const prev = state.outIdx > 0 ? RT().outdoor[state.outIdx - 1] : { lat: step.lat - 0.0012, lng: step.lng - 0.0009 };
    nav.pos = nav.pos || { lat: prev.lat, lng: prev.lng }; nav.acc = 5;
    if (nav.heading == null) { nav.heading = bearing(nav.pos, step) + 50; nav.demoHeading = true; }
    clearInterval(nav.demoTimer);
    nav.demoTimer = setInterval(() => {
      const t = RT().outdoor[state.outIdx]; if (!t) return;
      const d = distanceM(nav.pos, t);
      const speed = t.type === "bus" ? 120 : 9; // m / tick
      const f = Math.min(1, speed / Math.max(d, 1));
      nav.pos = { lat: nav.pos.lat + (t.lat - nav.pos.lat) * f, lng: nav.pos.lng + (t.lng - nav.pos.lng) * f };
      if (nav.demoHeading) nav.heading = (nav.heading + norm180(bearing(nav.pos, t) - nav.heading) * 0.35 + 360) % 360;
      nav.headingAt = Date.now();
      updateNavUI();
    }, 1500);
  }
  function stopNav() {

      <section class="card compass-wrap">

  // GPS가 아직 없으면 직전 지점에 있다고 가정해서라도 방향을 보여 줌
  function guessPos() {
    if (nav.pos) return nav.pos;
    const prev = RT().outdoor[state.outIdx - 1];
    return prev ? { lat: prev.lat, lng: prev.lng, guessed: true } : null;
  }
  function paintArrow() {
    if (state.screen !== "outdoor") return;
    const step = RT().outdoor[state.outIdx], arrow = $("#arrow"); if (!step || !arrow) return;
    const compassOk = nav.heading != null && Date.now() - nav.headingAt < 4000;
    const ring = $("#ring");
    if (ring) {
      const target = compassOk ? -nav.heading : 0;
      nav.ringDeg = nav.ringDeg == null ? target : nav.ringDeg + norm180(target - nav.ringDeg);
      ring.style.transform = `rotate(${nav.ringDeg}deg)`;
    }
    const p = guessPos();
    if (!p) return;
    const b = bearing(p, step);
    const rel = compassOk ? norm180(b - nav.heading) : norm180(b);
    // 359°→0° 를 넘을 때 한 바퀴 거꾸로 도는 것 방지: 각도를 누적
    nav.arrowDeg = nav.arrowDeg == null ? rel : nav.arrowDeg + norm180(rel - nav.arrowDeg);
    arrow.style.transform = `rotate(${nav.arrowDeg}deg)`;
    const st = $("#compassState");
    if (st) {

  // 길 안내 화면 아래 작은 지도: 나와 목적지, 그리고 직선
  function makeMiniMap(step) {
    if (!hasLeaflet()) { $("#miniMap").remove(); return; }

  }
  function updateMiniMap(step) {
    if (!maps.mini || !nav.pos) return;
    const now = Date.now(); if (now - maps.miniAt < 1500) return; maps.miniAt = now;
    const me = [nav.pos.lat, nav.pos.lng], to = [step.lat, step.lng];

    const b = L.latLngBounds([me, to]);
    if (now - maps.miniFitAt > 8000 || !maps.mini.getBounds().contains(b)) {

      maps.mini.fitBounds(b.pad(0.3), { maxZoom: 18, animate: false });
    }
  }

  // ───────────────────────── 진료 말씀 받아 적고 쉽게 요약 ─────────────────────────
  // 개인정보: 받아 적은 글과 요약은 이 화면에만 있고 저장하거나 서버에 남기지 않습니다. 소리 파일도 만들지 않습니다.
  const doc = { phase: "intro", finals: [], interim: "", rec: null, wantRec: false, startedAt: 0, timer: null, summary: null, back: "talk" };

  // 어려운 의학 용어 → 쉬운 말
  const EASY_WORDS = [
    [/고혈압/g, "고혈압(혈압이 높은 병)"], [/저혈압/g, "저혈압(혈압이 낮은 병)"], [/당뇨(병)?/g, "당뇨(피 속 당이 높은 병)"],
    [/고지혈증|이상지질혈증/g, "고지혈증(피에 기름이 많은 병)"], [/골다공증/g, "골다공증(뼈가 약해지는 병)"],
    [/관절염/g, "관절염(뼈마디 염증)"], [/협심증/g, "협심증(심장 혈관이 좁아진 병)"], [/부정맥/g, "부정맥(심장이 불규칙하게 뛰는 병)"],
    [/공복/g, "빈속"], [/금식/g, "금식(아무것도 먹지 않기)"], [/식후\s*(\d+|삼십|30)\s*분/g, "밥 먹고 $1분 뒤"], [/식후에?/g, "밥 먹고 나서"], [/식전에?/g, "밥 먹기 전에"],
    [/취침\s*전/g, "자기 전"], [/복용/g, "드시기"], [/투약|투여/g, "약 쓰기"], [/처방/g, "약 받기(처방)"],
    [/경과\s*관찰/g, "지켜보기"], [/추적\s*검사/g, "다시 하는 검사"], [/재진/g, "다시 오는 진료"], [/외래/g, "외래 진료"],
    [/부작용/g, "부작용(약 때문에 생기는 불편함)"], [/염증/g, "염증(붓고 열나는 것)"], [/수치/g, "수치(검사 숫자)"],
    [/혈액\s*검사|채혈/g, "피 검사"], [/소변\s*검사/g, "소변 검사"], [/영상\s*검사/g, "사진 찍는 검사"],
    [/양성/g, "양성"], [/음성/g, "음성"], [/정상\s*범위/g, "정상"], [/내원/g, "병원에 오기"], [/입원/g, "입원(병원에서 지내기)"],
    [/시술/g, "시술(간단한 치료)"], [/수술/g, "수술"], [/진통제/g, "진통제(아픈 것 줄이는 약)"], [/항생제/g, "항생제(세균 잡는 약)"],
    [/소염제/g, "소염제(붓기 줄이는 약)"], [/이뇨제/g, "이뇨제(소변 잘 나오게 하는 약)"], [/혈압약/g, "혈압약"]
  ];
  const DOC_CATS = [
    { key: "medicine", icon: "💊", title: "약 드시는 법", re: /약|복용|드세요|드시|먹|알씩|정씩|캡슐|처방|연고|바르|주사|파스|식후|식전|자기\s*전|아침|저녁|하루\s*(한|두|세|네|\d)/ },
    { key: "nextVisit", icon: "📅", title: "다음에 오실 때", re: /다음|예약|주\s*뒤|주\s*후|개월|달\s*뒤|다시\s*오|재진|외래|날짜|오세요|오시면/ },
    { key: "tests", icon: "🧪", title: "검사", re: /검사|혈액|피\s*검사|채혈|엑스레이|x-?ray|씨티|ct|mri|엠알아이|초음파|내시경|소변|심전도|금식/i },
    { key: "caution", icon: "⚠️", title: "꼭 조심하세요", re: /하지\s*마|마세요|피하|금지|조심|주의|안\s*돼|안\s*됩|술|담배|짜게|무리|넘어지|응급|바로\s*오|119|열이\s*나|숨이|어지러|붓|피가\s*나|부작용/ },
    { key: "diagnosis", icon: "🩺", title: "선생님 말씀 (몸 상태)", re: /진단|병|염|증|암|혈압|당뇨|수치|결과|괜찮|정상|나빠|좋아|좋아졌|문제|상태|때문/ }
  ];
  function splitKo(text) {
    return text
      .replace(/\s+/g, " ")
      .replace(/(습니다|니다|세요|에요|예요|어요|아요|해요|죠|고요|거든요|네요|군요|래요|대요|요)(\s)/g, "$1.$2")
      .split(/(?<=[.!?])\s+/).map(s => s.replace(/[.]+$/, "").trim()).filter(s => s.length > 3);
  }
  function easy(s) { return EASY_WORDS.reduce((t, [re, to]) => t.replace(re, to), s); }
  function localSummary(text) {
    const out = { oneLine: "", diagnosis: [], medicine: [], nextVisit: [], tests: [], caution: [], other: [] };
    const seen = new Set();
    splitKo(text).forEach(s => {
      const k = s.replace(/\s/g, ""); if (seen.has(k)) return; seen.add(k);
      // 한 문장이 여러 칸에 맞으면 더 중요한 칸(조심 > 약 > 다음 진료 > 검사 > 몸 상태) 하나에만 넣음
      const order = ["caution", "medicine", "nextVisit", "tests", "diagnosis"];
      let cat = order.find(c => DOC_CATS.find(d => d.key === c).re.test(s));
      // "검사 결과 보니까…" 처럼 결과를 설명하는 말은 몸 상태로
      if (cat === "tests" && /결과|보니까|나왔|상태/.test(s) && !/검사\s*(하|할|받|해)/.test(s)) cat = "diagnosis";
      (out[cat || "other"]).push(easy(s));
    });
    const bits = [];
    if (out.diagnosis.length) bits.push("몸 상태 설명");
    if (out.medicine.length) bits.push("약 드시는 법");
    if (out.tests.length) bits.push("검사");
    if (out.nextVisit.length) bits.push("다음 진료");
    if (out.caution.length) bits.push("조심할 점");
    out.oneLine = bits.length ? `오늘 선생님이 ${bits.join(", ")}을 말씀하셨어요.` : "받아 적은 내용을 정리했어요.";
    out.other = out.other.slice(0, 4);
    return out;
  }
  async function summarize(text) {
    if (server.ai) {
      try {
        const r = await fetch("api/summary", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
        if (r.ok) { const j = await r.json(); j.byAI = true; return j; }
      } catch {}
    }
    return localSummary(text);
  }
  function summarySpeech(s) {
    const parts = [s.oneLine];
    DOC_CATS.slice().reverse().forEach(c => { if (s[c.key] && s[c.key].length) parts.push(`${c.title.replace(/\s*\(.*\)/, "")}. ${s[c.key].join(". ")}.`); });
    return parts.join(" ").replace(/\(([^)]*)\)/g, ", $1,");
  }
  const docText = () => (doc.finals.join(" ") + " " + doc.interim).trim();

  function docStartRec() {
    if (!SR || !isSecureContext) { doc.phase = "type"; return renderDoctor(); }
    stopSpeaking();
    doc.wantRec = true;
    const startOne = () => {
      if (!doc.wantRec) return;
      const rec = new SR();
      rec.lang = "ko-KR"; rec.continuous = true; rec.interimResults = true;
      rec.onresult = (e) => {
        let interim = "";
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const r = e.results[i];
          if (r.isFinal) doc.finals.push(r[0].transcript.trim()); else interim += r[0].transcript;
        }
        doc.interim = interim; paintLive();
      };
      rec.onerror = (e) => {
        if (e.error === "not-allowed" || e.error === "service-not-allowed" || e.error === "audio-capture") {
          doc.wantRec = false; doc.micError = e.error;
        }
      };
      // 휴대폰은 조용하면 듣기를 멈추므로, "다 들었어요"를 누를 때까지 다시 켭니다
      rec.onend = () => {
        if (doc.interim) { doc.finals.push(doc.interim.trim()); doc.interim = ""; }
        doc.rec = null;
        if (doc.wantRec) setTimeout(startOne, 250);
        else if (doc.micError) { doc.phase = "type"; renderDoctor(); }
      };
      doc.rec = rec;

    };

  }
  function docStopRec() {
    doc.wantRec = false; clearInterval(doc.timer);

    if (doc.wake) { doc.wake.release().catch(() => {}); doc.wake = null; }
  }
  function paintLive() {
    const el = $("#liveText"); if (!el) return;
    el.innerHTML = esc(doc.finals.join(" ")) + (doc.interim ? ` <span class="interim">${esc(doc.interim)}</span>` : "") || '<span class="muted">말씀을 기다리는 중…</span>';
    el.scrollTop = el.scrollHeight;
  }
  async function docFinish() {
    docStopRec();
    await new Promise(r => setTimeout(r, 400));

    doc.summary = await summarize(text);
    renderDoctor();
  }

  function renderDoctor() {
    setStep("🩺 진료 내용 쉽게 듣기", doc.phase === "rec" ? "받아 적는 중" : doc.phase === "summary" ? "쉬운 말 정리" : "");
    const backBtn = btn("⬅ 돌아가기", "btn-light", () => { docStopRec(); go(doc.back || "home"); });

    if (doc.phase === "intro") {
      main.innerHTML = `
        <section class="card">
          <p class="big">선생님 말씀을 받아 적어<br>쉬운 말로 정리해 드려요.</p>
          <p class="muted" style="margin-top:10px">진료실에서 휴대폰을 책상 위에 올려 두세요.</p>

      dock.replaceChildren(
        btn("🎙 받아 적기 시작", "btn-xl btn-talk", docStartRec),

      );
      return speak("선생님 말씀을 받아 적어서, 쉬운 말로 정리해 드릴게요. 먼저 선생님께 화면을 보여 드리고, 괜찮다고 하시면 노란 버튼을 눌러 주세요.");
    }

    if (doc.phase === "rec") {
      main.innerHTML = `
        <section class="card rec-card">
          <p class="rec-dot">● 받아 적는 중 <span id="recTime">0분 00초</span></p>
          <div id="liveText" class="live-text"></div>
        </section>
        <p class="muted">말씀이 끝나면 아래 빨간 버튼을 눌러 주세요.</p>`;
      paintLive();
      dock.replaceChildren(btn("⏹ 다 들었어요 · 정리하기", "btn-xl btn-stop", docFinish), row(btn("✖ 취소", "btn-light", () => { docStopRec(); doc.finals = []; doc.interim = ""; doc.phase = "intro"; renderDoctor(); })));
      return;
    }

    if (doc.phase === "type") {
      main.innerHTML = `
        <section class="card">
          ${doc.micError ? `<p class="muted">바로 받아 적기가 안 돼서 다른 방법으로 할게요.</p>` : ""}
          <p class="big" style="font-size:24px">아래 칸을 누르고 키보드의 <span class="kbd">🎤</span> 버튼을 누른 채로 두면, 선생님 말씀이 글로 적혀요.</p>
          <p class="muted" style="margin-top:6px">약 봉투나 안내문 내용을 써도 돼요.</p>
        </section>

    // 2) 지도 검색: 별명 → 원래 말 → '병원' 붙이기 → 띄어쓰기 없애기 (찾으면 멈춤)
    const al = aliasOf(q);
    const spaced = q.replace(/\s/g, "").replace(/(.{2,})(이비인후과|정형외과|재활의학과|가정의학과|소아청소년과|비뇨의학과|산부인과|내과|안과|치과|피부과|한의원|신경과|외과)(의원)?$/, "$1 $2$3");
    const variants = [...new Set([al, q, spaced, /병원|의원|약국|치과|센터|보건소|과$/.test(q) ? null : q + "병원", q.replace(/\s/g, "")].filter(Boolean))];
    const take = (it, type) => {
      if (!it.name) return false;
      const health = HEALTH_RE.test(it.name) || ["hospital", "clinic", "doctors", "dentist", "pharmacy"].includes(type);
      if (!health) return false;
      push(it, Math.max(nameScore(q, it.name), al && normName(it.name) === normName(al) ? 1 : 0, 0.55));
      return true;
    };
    for (const v of variants) {
      let got = 0;
      try { for (const it of await photon(v, p)) if (take(it, it._type)) got++; } catch {}
      if (!got) { try { for (const x of await nominatim(v, p, 0.3, false)) if (take(osmToItem(x), x.type)) got++; } catch {} }
      if (got) break;
      await sleepMs(600);
    }
    // 3) 그래도 없으면 더 넓은 주변(약 8km)에서 비슷한 이름
    if (!out.length) { try { scan(await healthPool(p, 0.08)); } catch {} }
    return out;
  }
  // 글자 치는 동안 주변 목록에서 바로 추천 (인터넷 요청 없음)
  function nameSuggest(q) {
    if (!q || q.length < 2 || !pool.items.length) return [];
    return pool.items.map(it => ({ it, sc: nameScore(q, it.name) })).filter(x => x.sc >= 0.5)
      .sort((a, b) => b.sc - a.sc).slice(0, 5).map(x => x.it);
  }

  async function searchHosp(q, p) {
    const dept = deptQuery(q);
    const seen = new Set(), out = [];
    const add = (arr, filter) => arr.forEach(x => {
      const it = osmToItem(x); if (!it.name || seen.has(it.name)) return;
      if (filter && !filter(it, x)) return;
      seen.add(it.name); out.push(it);
    });
    if (dept === "약국") {
      add(await nominatim("[amenity=pharmacy]", p, 0.02, true));
      if (out.length < 3) add(await nominatim("약국", p, 0.04, true));
    } else if (dept) {
      // 진료과: 주변 병·의원(약 3km)에서 이름·진료과 정보로 찾기 → 적으면 약 8km까지 넓힘
      const pick = (arr) => arr.forEach(it => { if (!seen.has(it.name) && matchDept(it, dept)) { seen.add(it.name); out.push(it); } });
      pick(await healthPool(p, 0.03));
      try { add(await nominatim(dept, p, 0.05, true), (it) => matchDept(it, dept)); } catch {}
      if (out.length < 3) pick(await healthPool(p, 0.08));
      // 주변 목록을 못 받았을 때(지도 서버가 바쁠 때) 두 번째 검색으로
      if (out.length < 3) { try { (await photon(dept, p)).forEach(it => { if (!seen.has(it.name) && matchDept(it, dept) && distanceM(p, it) < 15000) { seen.add(it.name); out.push(it); } }); } catch {} }
    } else {
      return { list: await searchByName(q, p), dept: null, byName: true };
    }
    return { list: out, dept };
  }

  // ───────────────────────── 8. 출발 시간 계산 ─────────────────────────
  const WALK = 0.6; // 어르신 걷는 속도 (m/초) ≈ 시속 2.2km
  function parseKoTime(t) {
    const n = { 한: 1, 두: 2, 세: 3, 네: 4, 다섯: 5, 여섯: 6, 일곱: 7, 여덟: 8, 아홉: 9, 열: 10, 열한: 11, 열두: 12 };
    const m = t.replace(/\s/g, "").match(/(오전|오후|아침|낮|저녁)?(\d{1,2}|열한|열두|한|두|세|네|다섯|여섯|일곱|여덟|아홉|열)시(반|(\d{1,2})분)?/);
    if (!m) return null;
    let h = /\d/.test(m[2]) ? +m[2] : n[m[2]];
    const min = m[3] === "반" ? 30 : m[4] ? +m[4] : 0;
    if ((m[1] === "오후" || m[1] === "저녁" || m[1] === "낮") && h < 12) h += 12;
    if (!m[1] && h >= 1 && h <= 6) h += 12;            // "3시" 진료는 보통 오후
    const day = /모레/.test(t) ? 2 : /내일/.test(t) ? 1 : 0;
    return { h, min, day };
  }
  function planSteps(first) {

      out.push(["🚶 역 엘리베이터 → 정류장", Math.ceil(distanceM(O[0], O[1]) / WALK / 60) + 3]);
      out.push(["⏳ 7-1번 기다리기", 15]);
      out.push(["🚌 7-1번 타고 가기 (3정거장)", 10]);
      out.push(["🚶 정류장 → 1동 입구", Math.ceil(distanceM(O[2], O[3]) / WALK / 60) + 3]);
      out.push(["🏥 1동 → 창구 · 접수", 15]);
    } else {

  const LIVE = { timer: null, watch: null, last: null, lastAt: 0 };

  }

  // ───────────────────────── 버스 정보 연결 (경기도 버스정보 API) ─────────────────────────

  async function gbis(path, params) {
    const qs = new URLSearchParams({ serviceKey: decodeURIComponent(busKey()), format: "json", ...params });
    const r = await fetch(`https://apis.data.go.kr/6410000/${path}?${qs}`);
    if (!r.ok) throw new Error("http " + r.status);
    const j = await r.json(), code = String(j?.response?.msgHeader?.resultCode);
    if (code !== "0" && code !== "4") throw new Error("버스정보 오류 " + code);

  }

        min: +b["predictTime" + n], stops: b["locationNo" + n] || null, low: b["lowPlate" + n] === 1 || b["lowPlate" + n] === "1",

    return (await r.json()).items || [];
  }

        .map(s => ({ id: s.stationId, name: s.stationName, no: String(s.mobileNo || "").trim(), lat: +s.y, lng: +s.x, d: +s.distance || null }));
    }
    const r = await fetch(`${busBase()}api/stops?lat=${p.lat}&lng=${p.lng}`); if (!r.ok) throw new Error("stops");
    return (await r.json()).items || [];
  }

  // ───────────────────────── 🚏 버스 정류장 안내 ─────────────────────────
  const STOPS = { list: [], sel: null, timer: null, said: {} };

      ${busRealtime() ? "" : `<section class="card warn-card"><p style="margin:0;font-size:18px">ℹ️ 지금은 정류장 위치만 보여요. <b>실시간 버스 도착</b>은 팀에서 받은 ‘버스 설정 QR’을 한 번 찍거나 ⚙︎ 설정에 버스 키를 넣으면 보여요.</p></section>`}
      <div id="curStop"></div>
      <div id="stopMap" class="map mini"></div>

  async function loadStops() {
    const box = $("#stopList");

      btn("🧭 이 정류장까지 길 안내", "btn-xl btn-primary", () => guideTo({ name: s.name + " 정류장", lat: s.lat, lng: s.lng })),
      row(btn("🔊 다시 듣기", "btn-light", () => sayArrivals(true)), btn("⬅ 다른 정류장", "btn-light", () => { STOPS.sel = null; renderStops(); }))

  let lastArr = [];
  async function loadArrivals() {

    const rows = items.map(x => ({ ...x, first: x.buses[0] })).sort((a, b) => (a.first ? a.first.min : 999) - (b.first ? b.first.min : 999));

    if (!rows.length) { box.innerHTML = `<p class="muted">이 정류장에 서는 버스 정보가 없어요.</p>`; return sayArrivals(); }

  }

  // ───────────────────────── 🏥 병원 안 안내 ─────────────────────────

  const VISIT_STEPS = [
    { k: "reception", t: "접수하기", icon: "🆕", say: "먼저 접수를 해요. 처음 오셨으면 처음오신 분 창구, 다시 오셨으면 접수 창구나 무인 접수기로 가세요. 신분증을 꺼내 두세요.",

  // ───────────────────────── 🚇 지하철역 안내 ─────────────────────────
  const SUB = { list: [], sel: null, exits: null };
  async function loadSubway() {
    const box = $("#subList");
    let p = nav.pos; if (!p) { await requestLocation(); p = nav.pos; }
    if (!p) { box.innerHTML = `<div class="sign">📍 위치를 알 수 없어요. 위치를 켜 주세요.</div>`; return; }
    let raw;
    try { raw = await photonReverse(p, "railway:station", 3, 30); } catch { box.innerHTML = `<p class="muted">역 정보를 가져오지 못했어요. 인터넷을 확인해 주세요.</p>`; return; }
    // 같은 역(노선마다 따로 있는 점)은 하나로
    const out = [];
    raw.filter(s => s.name).forEach(s => {
      const nm = /역$/.test(s.name) ? s.name : s.name + "역";
      const same = out.find(o => o.name === nm && distanceM(o, s) < 400);
      if (!same) out.push({ name: nm, lat: s.lat, lng: s.lng, addr: [s.props.district, s.props.street].filter(Boolean).join(" ") });
    });
    out.forEach(s => { s.d = distanceM(p, s); }); out.sort((a, b) => a.d - b.d);
    SUB.list = out.slice(0, 6);
    if (!SUB.list.length) { box.innerHTML = `<p class="muted">3km 안에 지하철역이 없어요.</p>`; return speak("가까운 지하철역이 없어요."); }
    box.innerHTML = "";
    SUB.list.forEach((s, i) => box.append(btn(`<span class="near-no sub">${i + 1}</span><span class="stop-txt"><b>🚇 ${esc(s.name)}</b><small>${distText(s.d)}${s.addr ? " · " + esc(s.addr) : ""}</small></span><span class="stop-go">›</span>`, "btn-light stop-item", () => { SUB.sel = s; SUB.exits = null; renderStops(); })));
    const f = SUB.list[0];
    speak(f.d < 150 ? `지금 ${f.name} 근처에 계세요. 역을 누르면 출구와 엘리베이터를 알려 드려요.` : `가장 가까운 지하철역은 ${f.name}이에요. ${distSpeech(f.d).replace(" 남았어요", "")} 거리예요.`);
  }
  async function loadExits() {
    const s = SUB.sel, box = $("#exitBox");
    try {
      const j = await overpass(`[out:json][timeout:12];(node["railway"="subway_entrance"](around:450,${s.lat},${s.lng});node["highway"="elevator"](around:350,${s.lat},${s.lng}););out;`);
      const ex = [], el = [];
      j.elements.forEach(e => {
        const t = e.tags || {}, it = { lat: e.lat, lng: e.lon, ref: t.ref || (t.name || "").replace(/[^0-9-]/g, ""), name: t.name || "", wheel: t.wheelchair, level: t.level };
        (t.railway === "subway_entrance" ? ex : el).push(it);
      });
      ex.sort((a, b) => (parseInt(a.ref) || 99) - (parseInt(b.ref) || 99));
      SUB.exits = { ex, el };
    } catch { SUB.exits = { failed: true }; }

  }
  function paintExits() {
    const box = $("#exitBox"); if (!box) return;
    const E = SUB.exits;
    if (!E) { box.innerHTML = `<p class="muted">출구·엘리베이터를 찾는 중…</p>`; return; }

    if (E.failed || (!E.ex.length && !E.el.length)) {
      box.innerHTML = `<p class="muted">이 역의 출구·엘리베이터 위치 정보를 가져오지 못했어요.</p>

      return;
    }
    const near = nav.pos;
    const ord = (a) => near ? a.slice().sort((x, y) => distanceM(near, x) - distanceM(near, y)) : a;
    box.innerHTML = `

      <div class="exit-list" id="exList"></div>`;
    ord(E.el).slice(0, 6).forEach(e => $("#elList").append(btn(`🛗 ${esc(e.name || "엘리베이터")}${near ? ` <small>${distText(distanceM(near, e))}</small>` : ""}`, "btn-light exit-item", () => go2(`${SUB.sel.name} 엘리베이터`, e.lat, e.lng))));
    ord(E.ex).forEach(e => $("#exList").append(btn(`🚪 ${e.ref ? esc(e.ref) + "번 출구" : esc(e.name || "출구")}${e.wheel === "yes" ? " ♿" : ""}${near ? ` <small>${distText(distanceM(near, e))}</small>` : ""}`, "btn-light exit-item", () => go2(`${SUB.sel.name} ${e.ref ? e.ref + "번 출구" : "출구"}`, e.lat, e.lng))));
    const el0 = ord(E.el)[0];
    speak(el0 && near ? `가장 가까운 엘리베이터는 ${distSpeech(distanceM(near, el0)).replace(" 남았어요", "")} 거리예요. 누르면 길을 안내해 드려요.` : `${SUB.sel.name} 출구 ${E.ex.length}개를 찾았어요. 누르면 길을 안내해 드려요.`);
  }

  // ───────────────────────── 먼 곳은 '어떻게 갈까요?' (걷기 · 버스 · 지하철·환승 · 택시) ─────────────────────────
  const WALK_MAX = 900;   // 이보다 멀면 걸어가라고 하지 않음
  async function guideTo(dest) {
    state.dest = { name: dest.name, lat: dest.lat, lng: dest.lng }; state.outIdx = 0; save();
    if (!nav.pos && !state.demo) await Promise.race([requestLocation(), new Promise(r => setTimeout(r, 6000))]);
    if (nav.pos && distanceM(nav.pos, dest) <= WALK_MAX) return go("outdoor");
    HOW.plans = null; HOW.err = ""; HOW.metro = null; HOW.merr = false; openScreen("howto");
  }
  const HOW = { plans: null, err: "", busy: false };
  const routeCache = new Map();
  async function routeStationsCached(id) {
    if (!routeCache.has(id)) routeCache.set(id, routeStations(id).catch(e => { routeCache.delete(id); throw e; }));
    return routeCache.get(id);
  }
  // 지금 위치 근처 정류장에서 → 목적지 근처 정류장까지 '한 번에 가는 버스' 찾기
  async function findDirectBuses(p, dest, onProg) {
    const stops = (await busStopsNear(p)).filter(s => s.id).map(s => ({ ...s, d: distanceM(p, s) })).sort((a, b) => a.d - b.d).slice(0, 5);
    if (!stops.length) throw new Error("nostop");
    const routes = new Map();
    for (const s of stops) {
      let list = []; try { list = await busArrivals(s.id); } catch {}
      list.forEach(a => {
        const k = String(a.routeId), prev = routes.get(k), w = a.buses[0] ? a.buses[0].min : null;
        if (!prev || s.d < prev.stop.d) routes.set(k, { routeId: a.routeId, routeName: a.routeName, dest: a.dest, stop: s, wait: w });
      });
    }
    const plans = [], all = [...routes.values()].slice(0, 30);
    let k = 0;
    for (const r of all) {
      onProg && onProg(++k, all.length);
      let st; try { st = await routeStationsCached(r.routeId); } catch { continue; }
      const b = st.findIndex(x => String(x.id) === String(r.stop.id)); if (b < 0) continue;
      let best = -1, bd = Infinity;
      for (let i = b + 1; i < Math.min(st.length, b + 90); i++) { const d = distanceM(dest, st[i]); if (d < bd) { bd = d; best = i; } }
      if (best < 0 || bd > 900) continue;
      const n = best - b, walk = (m) => m * 1.3 / WALK / 60;
      plans.push({ routeId: r.routeId, routeName: r.routeName, routeDest: r.dest,
        board: { id: r.stop.id, name: r.stop.name, lat: r.stop.lat, lng: r.stop.lng }, alight: { id: st[best].id, name: st[best].name, lat: st[best].lat, lng: st[best].lng },
        stops: n, walk1: r.stop.d, walk2: bd, wait: r.wait, mins: Math.round(walk(r.stop.d) + (r.wait ?? 12) + n * 2 + walk(bd)) });
    }
    // 같은 버스 번호는 하나만, 빠른 순
    const seen = new Set();
    return plans.sort((a, b) => a.mins - b.mins).filter(x => !seen.has(x.routeName) && seen.add(x.routeName)).slice(0, 4);
  }
  function mapLinks(p, d) {
    const sn = encodeURIComponent("현재 위치"), dn = encodeURIComponent(d.name);
    return {
      kakaoApp: `kakaomap://route?sp=${p.lat},${p.lng}&ep=${d.lat},${d.lng}&by=PUBLICTRANSIT`,
      kakaoWeb: `https://map.kakao.com/link/from/${sn},${p.lat},${p.lng}/to/${dn},${d.lat},${d.lng}`,
      naverApp: `nmap://route/public?slat=${p.lat}&slng=${p.lng}&sname=${sn}&dlat=${d.lat}&dlng=${d.lng}&dname=${dn}&appname=hangeoreum.github.io`,
      naverWeb: `https://map.naver.com/p/directions/${p.lng},${p.lat},${sn},,/${d.lng},${d.lat},${dn},,/-/transit`
    };
  }
  // 앱이 있으면 앱으로, 없으면 웹으로
  function openMapApp(app, web) {
    let left = false;
    const onHide = () => { left = true; };
    document.addEventListener("visibilitychange", onHide, { once: true });
    location.href = app;
    setTimeout(() => { document.removeEventListener("visibilitychange", onHide); if (!left && !document.hidden) window.open(web, "_blank", "noopener"); }, 1400);
  }
  function renderHowto() {
    const d = state.dest; if (!d) return go("home");
    const p = nav.pos;
    const dist = p ? distanceM(p, d) : null;
    setStep("🧭 어떻게 갈까요?", d.name);
    const walkMin = dist ? Math.round(dist * 1.3 / WALK / 60) : null;
    main.innerHTML = `
      <section class="card">
        <p class="muted" style="margin:0">가는 곳</p>
        <p class="big" style="font-size:26px">📍 ${esc(d.name)}</p>
        ${dist ? `<p style="margin:6px 0 0;font-size:19px">지금 여기서 <b>${distText(dist)}</b>${dist > 2000 ? " · 걸어가기엔 너무 멀어요" : ` · 걸어서 약 ${walkMin}분`}</p>` : `<p class="muted">지금 위치를 몰라요. 위치를 켜 주세요.</p>`}
      </section>
      <section class="card" id="metroPlans"><p class="sum-title" style="font-size:21px">🚇 지하철로 가기 <small class="muted">(갈아타기까지 앱이 안내)</small></p><div id="metroList"><p class="muted">지하철 길을 찾는 중…</p></div></section>
      <section class="card" id="busPlans"><p class="sum-title" style="font-size:21px">🚌 한 번에 가는 버스 <small class="muted">(앱이 끝까지 안내)</small></p><div id="planList"></div></section>
      <section class="card">
        <p class="sum-title" style="font-size:21px">🗺 다른 지도 앱으로도 보기</p>
        <p class="muted" style="margin:0 0 8px;font-size:16px">버스를 두 번 갈아타는 길 등은 지도 앱에서도 확인할 수 있어요.</p>
        <div class="row2"><button class="btn btn-light" id="kakaoBtn">🟡 카카오맵</button><button class="btn btn-light" id="naverBtn">🟢 네이버 지도</button></div>
      </section>
      <div class="row2">
        ${dist != null && dist <= 2000 ? `<button class="btn btn-light" id="walkBtn">🚶 걸어서 (약 ${walkMin}분)</button>` : ""}
        <button class="btn btn-light" id="taxiBtn">🚕 택시 타기</button>
      </div>`;
    // 가까우면(약 3km 안) 버스를 먼저, 멀면 지하철을 먼저
    if (dist && dist < 3000) { $("#metroPlans").before($("#busPlans")); }
    if (p) {
      const L2 = mapLinks(p, d);
      $("#kakaoBtn").onclick = () => openMapApp(L2.kakaoApp, L2.kakaoWeb);
      $("#naverBtn").onclick = () => openMapApp(L2.naverApp, L2.naverWeb);
    } else { $("#kakaoBtn").disabled = $("#naverBtn").disabled = true; }
    const wb = $("#walkBtn"); if (wb) wb.onclick = () => go("outdoor");
    $("#taxiBtn").onclick = () => openScreen("taxi");
    dock.replaceChildren(row(btn("🔄 다시 찾기", "btn-light", () => { HOW.plans = null; HOW.metro = null; renderHowto(); }), backBtnTo("howto")));
    paintPlans(); paintMetro();
    if (!HOW.plans && !HOW.busy && p) runPlanSearch();
    if (!HOW.metro && !HOW.mbusy && p) runMetroSearch();
    if (!p && !renderHowto.asked) { renderHowto.asked = true; requestLocation().then(() => { renderHowto.asked = false; if (nav.pos && state.screen === "howto") renderHowto(); }); }
  }
  async function runMetroSearch() {
    HOW.mbusy = true; paintMetro();
    try { HOW.metro = await findMetroPlans(nav.pos, state.dest, (t) => { const el = $("#metroList"); if (el) el.innerHTML = `<p class="muted">${t}</p>`; }); }
    catch { HOW.metro = []; HOW.merr = true; }

  function paintMetro() {
    const box = $("#metroList"); if (!box) return;

        ${lines.map(x => `<small>${esc(x)}</small>`).join("")}</span>`, "btn-light plan-item", () => {

  async function runPlanSearch() {

    });
  }

  // ───────────────────────── 🚇 앱 안에서 지하철 길찾기 (subway.json) ─────────────────────────
  // 수도권 전철 노선·역 순서(OpenStreetMap)로 '바로 가는 노선'과 '한 번 갈아타기'를 찾아요.
  const METRO = { data: null, loading: null, stations: null };
  const mkey = (n) => String(n || "").replace(/\s|역$/g, "");
  function loadMetro() {
    if (METRO.data) return Promise.resolve(METRO.data);
    // 한 파일 HTML 에서는 지하철 자료가 window.SUBWAY_DATA 로 들어 있어요
    const src = window.SUBWAY_DATA ? Promise.resolve(window.SUBWAY_DATA) : fetch("subway.json?v=1").then(r => r.json());
    if (!METRO.loading) METRO.loading = src.then(j => {
      METRO.data = j.lines;
      const st = new Map();
      j.lines.forEach((l, li) => l.s.forEach(([n, lat, lng], si) => {
        const k = mkey(n);
        if (!st.has(k)) st.set(k, { name: n.replace(/역$/, "") + "역", key: k, lat, lng, at: [] });
        st.get(k).at.push([li, si]);
      }));
      METRO.stations = [...st.values()];
      return METRO.data;
    }).catch(e => { METRO.loading = null; throw e; });
    return METRO.loading;
  }
  function nearStations(p, maxM, n) {
    return METRO.stations.map(s => ({ s, d: distanceM(p, s) })).filter(x => x.d <= maxM).sort((a, b) => a.d - b.d).slice(0, n);
  }
  const walkMin = (m) => m * 1.3 / WALK / 60;
  // 지하철 구간 하나
  function subLeg(li, a, b) {
    const L = METRO.data[li], stops = L.s.slice(a, b + 1).map(x => x[0].replace(/역$/, ""));
    const to = L.s[b];
    // 2호선처럼 도는 노선(출발=도착)은 '다음 역 방면'으로 안내
    const dir = (L.f && L.f === L.t) ? (stops[1] || stops[0]) : (L.t || L.s[L.s.length - 1][0]);
    return { t: "subway", line: L.n, color: L.c, dir: dir.replace(/역$/, ""), from: stops[0], to: stops[stops.length - 1], stops, n: b - a, lat: to[1], lng: to[2] };
  }
  // 출발역 o → 도착역 d (바로 가거나 한 번 갈아타기)
  function metroPaths(o, d) {
    const res = [];
    for (const [la, ia] of o.at) {
      const A = METRO.data[la];
      for (const [lb, jb] of d.at) {
        if (la === lb && ia < jb) { res.push({ legs: [subLeg(la, ia, jb)], ride: jb - ia, tr: 0 }); continue; }
        if (la === lb) continue;
        const B = METRO.data[lb];
        if (A.n === B.n) continue;                        // 같은 노선의 반대 방향은 갈아타기로 치지 않음
        for (let k = ia + 1; k < A.s.length; k++) {
          const x = mkey(A.s[k][0]);
          const m = B.s.findIndex((s, mi) => mi < jb && mkey(s[0]) === x);
          if (m >= 0) { res.push({ legs: [subLeg(la, ia, k), subLeg(lb, m, jb)], ride: (k - ia) + (jb - m), tr: 1, via: A.s[k][0] }); break; }
        }
      }
    }
    return res;
  }
  async function findMetroPlans(p, dest, onProg) {
    await loadMetro();
    const total = distanceM(p, dest);
    if (total < 1500) return [];
    const D = nearStations(dest, 1300, 3);
    if (!D.length) return [];
    let O = nearStations(p, 1300, 3).map(x => ({ ...x, access: { t: "walk", m: x.d } }));
    // 걸어갈 만한 역이 없으면 버스로 갈 수 있는 역 찾기
    if (!O.length && busRealtime()) {
      onProg && onProg("가까운 역까지 가는 버스를 찾는 중…");
      for (const x of nearStations(p, 8000, 2)) {
        try {
          const bp = (await findDirectBuses(p, x.s))[0];
          if (bp) O.push({ s: x.s, d: x.d, access: { t: "bus", plan: bp, m: bp.walk1 } });
        } catch {}
      }
    }
    const plans = [];
    for (const o of O) for (const d of D) {
      if (o.s.key === d.s.key) continue;
      metroPaths(o.s, d.s).forEach(path => {
        const accessMin = o.access.t === "walk" ? walkMin(o.d) : o.access.plan.mins;
        const mins = Math.round(accessMin + 4 + path.ride * 2.3 + path.tr * 7 + walkMin(d.d) + 3);
        plans.push({ o: o.s, d: d.s, access: o.access, path, walkEnd: d.d, mins });
      });
    }
    const seen = new Set();
    return plans.sort((a, b) => a.mins - b.mins || a.path.tr - b.path.tr)
      .filter(P => { const k = P.path.legs.map(l => l.line + l.from + l.to).join("|"); return !seen.has(k) && seen.add(k); }).slice(0, 3);
  }
  // 지하철 계획 → 단계별 안내(legs)
  function metroLegs(P, dest) {
    const legs = [];
    if (P.access.t === "bus") {
      const B = P.access.plan;
      legs.push({ t: "walk", name: `${B.board.name} 정류장`, lat: B.board.lat, lng: B.board.lng, bus: { stationId: B.board.id, routeId: B.routeId, routeName: B.routeName, alightStationId: B.alight.id },
        screen: `${B.board.name} 정류장까지 걸어가세요.`, sign: `정류장 이름판 ‘${B.board.name}’ · 여기서 ${B.routeName}번을 타요.` });
      legs.push({ t: "bus", B });
    }
    legs.push({ t: "walk", name: P.o.name, lat: P.o.lat, lng: P.o.lng, station: true,
      screen: `${P.o.name}까지 걸어가세요.`, sign: `역 입구의 ‘엘리베이터’ 표시가 있는 출구로 들어가세요. 보행기·휠체어는 꼭 엘리베이터를 타세요.` });
    P.path.legs.forEach((l, i) => legs.push({ ...l, transfer: i > 0 }));
    legs.push({ t: "walk", name: dest.name, lat: dest.lat, lng: dest.lng,
      screen: `${dest.name}까지 걸어가세요.`, sign: "역에서 나갈 때는 엘리베이터가 있는 출구로 나가세요. 가까이 가면 건물 간판을 확인하세요." });
    return legs;
  }
  function metroSummary(P) {
    const parts = [];
    if (P.access.t === "bus") parts.push(`🚌 ${P.access.plan.routeName}번`);
    else parts.push(`🚶 ${distText(P.access.m)}`);
    P.path.legs.forEach((l, i) => { if (i) parts.push("🔁 갈아타기"); parts.push(`🚇 ${l.line} ${l.from}→${l.to} (${l.n}역)`); });
    parts.push(`🚶 ${distText(P.walkEnd)}`);
    return parts;
  }

  // 지하철 타는 단계 화면 (땅속이라 GPS 대신 ‘한 역 지났어요’ 버튼)
  function renderSubwayStep(step) {
    const i = state.outIdx;
    const cur = Math.min(store.get("subCur", 0), step.stops.length - 1);
    setStep(`2. 가는 길 ${i + 1}/${RT().outdoor.length}`, "지하철");
    const left = step.stops.length - 1 - cur;
    main.innerHTML = `
      <div class="progress">${RT().outdoor.map((_, k) => `<i class="${k <= i ? "on" : ""}"></i>`).join("")}</div>
      <section class="card sub-card" style="border-color:${step.color || "#6b3fa0"}">
        ${step.transfer ? '<p class="badge" style="background:#ffe9c7;color:#7a4a00">🔁 갈아타기</p>' : ""}
        <p class="sub-line" style="background:${step.color || "#6b3fa0"}">🚇 ${esc(step.line)}</p>
        <p class="big" style="font-size:26px;margin-top:8px"><b>${esc(step.dir)}</b> 방면 열차를 타세요</p>
        <p style="margin:6px 0 0;font-size:20px">${esc(step.from)} → <b>${esc(step.to)}</b> (${step.n}정거장)</p>
        <p class="ride-left" style="margin-top:10px">${left <= 0 ? "🛑 지금 내리세요!" : left === 1 ? "🔔 다음 역에서 내려요" : `내릴 역까지 <b>${left}정거장</b>`}</p>
      </section>
      <ol class="ride-list">${step.stops.map((s, k) => `<li class="${k < cur ? "done" : k === cur ? "cur" : ""} ${k === step.stops.length - 1 ? "goal" : ""}">${k === cur ? "🚇 " : k === step.stops.length - 1 ? "🏁 " : ""}${esc(s)}</li>`).join("")}</ol>
      <p class="sign">🪧 ${step.transfer ? `‘${esc(step.line)}’ 갈아타는 곳 표지판을 따라가세요. ` : ""}승강장에서 <b>‘${esc(step.dir)} 방면’</b> 글자를 확인하세요. 보행기·휠체어는 엘리베이터를 타세요.</p>`;
    const passBtn = btn("➕ 한 역 지났어요", "btn-light", () => {
      store.set("subCur", cur + 1);
      const l2 = step.stops.length - 2 - cur;
      if (l2 === 1) { vibrate([200, 100, 200]); speak(`다음 역은 ${step.to}, 내리실 역이에요. 문 앞으로 천천히 가세요.`); }
      else if (l2 <= 0) { vibrate([300, 100, 300]); speak(`${step.to}역이에요. 지금 내리세요.`); }
      else speak(`지금 ${step.stops[cur + 1]}역이에요. ${l2}정거장 남았어요.`);
      renderSubwayStep(step);
    });
    dock.replaceChildren(
      btn(`🛑 ${esc(step.to)}역에서 내렸어요 · 다음`, "btn-xl btn-primary", () => { store.set("subCur", 0); nextOutdoor(); }),
      row(passBtn, helpBtn()), row(replayBtn(), btn("⬅ 이전", "btn-light", () => { store.set("subCur", 0); if (state.outIdx > 0) { state.outIdx--; save(); renderOutdoor(); } }))
    );
    if (!renderSubwayStep.spoken || renderSubwayStep.spoken !== `${i}`) {
      renderSubwayStep.spoken = `${i}`;
      speak(`${step.transfer ? "갈아타요. " : ""}${step.line}, ${step.dir} 방면 열차를 타세요. ${step.n}정거장 가서 ${step.to}역에서 내려요. 한 역을 지날 때마다 아래 버튼을 눌러 주시면, 내릴 때를 알려 드릴게요.`);
    }
  }

  // ───────────────────────── 렌더 ─────────────────────────
  function render() {
    document.body.classList.toggle("reduce", state.reduce);
    if (state.screen === "outdoor" || state.screen === "indoor") store.set("trip", state.screen);
    if (state.screen === "done") store.set("trip", null);
    const ms = $("#menuSheet"); if (ms) ms.remove();
    // 큰 "누르고 말하기" 버튼이 이미 있는 화면에서는 떠 있는 마이크를 숨김
    const f = $("#fab"); if (f) f.hidden = ["home", "talk", "perm", "mictest", "near", "howto"].includes(state.screen) && !(typeof HF !== "undefined" && HF.on);
    if (maps.pick) { maps.pick.remove(); maps.pick = null; }
    if (maps.mini) { maps.mini.remove(); maps.mini = null; }
    if (maps.near) { maps.near.remove(); maps.near = null; }
    ({ howto: renderHowto, ride: renderRide, stops: renderStops, inside: renderInside, mictest: renderMicTest, home: renderHome, lang: renderLang, taxi: renderTaxi, plan: renderPlan, where: renderWhere, guardian: renderGuardian, near: renderNear, doctor: renderDoctor, perm: renderPerm, pick: renderPick, talk: renderTalk, confirm: renderConfirm, apply: renderApply, outdoor: renderOutdoor, indoor: renderIndoor, done: renderDone }[state.screen] || renderHome)();
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
  function resetAll() {
    stopSpeaking(); stopNav(); store.clear(); notified.clear();
    Object.assign(state, { screen: "home", slots: { hospital: null, firstVisit: null, mobility: null, reception: null }, heard: "", outIdx: 0, inIdx: 0, dest: null });
    nav.pos = null; nav.heading = null; save(); render();
  }

  // ───────────────────────── 상단 버튼 / 설정 ─────────────────────────
  const soundBtn = $("#btnSound");
  function paintSound() { soundBtn.textContent = state.sound ? "🔊" : "🔇"; soundBtn.setAttribute("aria-label", state.sound ? "소리 켜짐 (누르면 끔)" : "소리 꺼짐 (누르면 켬)"); soundBtn.setAttribute("aria-pressed", state.sound); }
  soundBtn.onclick = () => { state.sound = !state.sound; if (!state.sound) stopSpeaking(); save(); paintSound(); };
  paintSound();

  function updateEngineInfo() {
    loadVoices();
    $("#engineInfo").textContent =
      `말 알아듣기: ${server.ai ? "AI(GPT) 해석" : "기기 안 규칙 해석"} · 목소리: ${server.tts ? "AI 자연 음성 사용 가능" : "기기 내장 한국어 음성"} · 음성 인식: ${SR ? "사용 가능" : "지원 안 됨"}`;
  }
  $("#btnMenu").onclick = openMenu;
  function openSettings() {
    $("#rateInput").value = state.rate; $("#rateVal").textContent = state.rate.toFixed(2) + "배";
    $("#demoToggle").checked = state.demo; $("#reduceMotion").checked = state.reduce;
    updateEngineInfo(); paintBusKey(); $("#settings").hidden = false;
  };
  $("#settingsClose").onclick = () => { $("#settings").hidden = true; if (state.screen === "outdoor") render(); };
  $("#voiceSelect").onchange = (e) => { state.voiceURI = e.target.value; save(); };
  $("#rateInput").oninput = (e) => { state.rate = +e.target.value; $("#rateVal").textContent = state.rate.toFixed(2) + "배"; save(); };
  $("#demoToggle").onchange = (e) => { state.demo = e.target.checked; nav.pos = null; nav.heading = null; save(); };
  $("#reduceMotion").onchange = (e) => { state.reduce = e.target.checked; save(); document.body.classList.toggle("reduce", state.reduce); };
  $("#testVoice").onclick = () => speak("안녕하세요. 병원 한걸음이에요. 천천히, 한 걸음씩 같이 가요.", { force: true });
  $("#guardianBtn").onclick = openGuardian;
  const paintBusKey = () => { $("#busKeyState").textContent = busKey() ? "✅ 이 휴대폰에 저장됨" : "없음"; $("#busKeyInput").value = ""; };
  $("#busKeySave").onclick = () => { const v = $("#busKeyInput").value.trim(); if (v.length < 20) return speak("키를 다시 확인해 주세요.", { force: true }); store.set("busKey", v); paintBusKey(); speak("버스 정보 키를 저장했어요.", { force: true }); };
  $("#busKeyDel").onclick = () => { store.set("busKey", ""); paintBusKey(); };
  $("#hfToggle").checked = HF.on;
  $("#hfToggle").onchange = (e) => setHandsfree(e.target.checked);
  $("#helpWhere").onclick = () => openScreen("where");
  $("#helpLang").onclick = () => openScreen("lang");
  $("#sosGuardian").onclick = () => { $("#sos").hidden = true; notifyGuardians("help", "도움이 필요해요! 119에 전화하려고 해요. 연락 주세요.", { force: true, urgent: true }); };
  $("#helpGuardian").onclick = () => { $("#helpCard").hidden = true; notifyGuardians("help", `길을 잃었어요. ${state.screen === "indoor" ? "분당서울대병원 1동 안이에요." : ""} 연락 주세요.`, { force: true, urgent: true }); };
  $("#permAgain").onclick = () => { $("#settings").hidden = true; perm.loc = perm.mic = perm.compass = "unknown"; go("perm"); };
  $("#resetAll").onclick = () => { $("#settings").hidden = true; resetAll(); };

  // 브라우저 자동재생 정책: 첫 터치 후에야 소리가 나므로, 첫 터치 때 현재 안내를 다시 읽음
  let unlocked = false;
  document.addEventListener("pointerdown", (e) => {
    if (unlocked) return; unlocked = true;
    if (e.target.closest("button, select, input")) return;
    if (synth && !synth.speaking && state.lastSaid && state.sound) setTimeout(() => { if (!synth.speaking) speak(state.lastSaid); }, 50);
  }, { once: false, capture: true });

  const iosNeedsCompassTap = typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function";
  if (!iosNeedsCompassTap) startCompass();
  else {
    const askOnTap = () => {
      if (nav.orientHandler || nav.sensorAsked) return;
      nav.sensorAsked = true;
      DeviceOrientationEvent.requestPermission().then(r => {
        perm.compass = r === "granted" ? "granted" : "denied";
        if (r === "granted") { startCompass(); const sb = $("#sensorBtn"); if (sb) sb.hidden = true; }
        paintArrow();
      }).catch(() => { nav.sensorAsked = false; });
    };
    document.addEventListener("click", askOnTap, true);
    document.addEventListener("touchend", askOnTap, true);
  }

  render();
})();

</script>
