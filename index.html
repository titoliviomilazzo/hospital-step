<!doctype html>
<html lang="ko" data-screen="prepare">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>병원한걸음</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <span id="stage-pill" class="pill">1단계 방문 준비</span>
    <span id="progress" class="progress" aria-live="polite"></span>
    <button id="btn-settings" class="btn small" type="button" aria-label="설정 열기">설정</button>
  </header>

  <main id="main" class="main" tabindex="-1">
    <div id="live" aria-live="polite" aria-atomic="true"><h1 id="instruction" class="instruction"></h1></div>
    <div id="screen"></div>
    <noscript><p class="instruction">이 앱은 자바스크립트가 필요해요.</p></noscript>
  </main>

  <nav class="bar" aria-label="공통 버튼">
    <div class="bar-row">
      <button id="btn-replay" class="btn" type="button">다시 듣기</button>
      <button id="btn-help" class="btn" type="button">도움 요청</button>
    </div>
    <button id="btn-primary" class="btn primary" type="button">길 안내 시작</button>
  </nav>

  <div id="overlay-help" class="overlay help" hidden></div>
  <div id="overlay-chooser" class="overlay" hidden></div>
  <div id="overlay-settings" class="overlay" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
